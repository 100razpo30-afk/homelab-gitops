apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: local-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - grafana.local.lan
  rules:
    - backendRefs:
        - name: vm-stack-grafana
          port: 80

