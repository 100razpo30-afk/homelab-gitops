apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: local-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - argocd.local.lan
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80

