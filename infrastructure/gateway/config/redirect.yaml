apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-http-to-https
  namespace: gateway-system
spec:
  parentRefs:
    - name: local-gateway
      sectionName: http
  hostnames:
    - contest.local.lan
    - kontent.local.lan
    - keycloak.local.lan
    - minio.local.lan
    - minio-console.local.lan
    - grafana.local.lan
    - argocd.local.lan
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308

