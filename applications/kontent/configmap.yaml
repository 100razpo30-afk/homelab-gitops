apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: kontent
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USER: "tracker"
  DB_NAME: "tracker"
  DB_SSL: "false"
  PORT: "3000"
  JWT_EXPIRES_IN: "12h"
  S3_ENDPOINT: "http://minio:9000"
  S3_PUBLIC_ENDPOINT: "https://minio.local.lan"
  S3_REGION: "us-east-1"
  S3_BUCKET: "media"
  S3_FORCE_PATH_STYLE: "true"
  S3_CREATE_BUCKET: "true"
  KEYCLOAK_HOSTNAME: "keycloak.local.lan"
  KEYCLOAK_URL: "http://keycloak:8080"
  KEYCLOAK_REALM: "kontent"
  CORS_ORIGIN: "https://kontent.local.lan"
  S3_CORS_ORIGINS: "https://kontent.local.lan"

