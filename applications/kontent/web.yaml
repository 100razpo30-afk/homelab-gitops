apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kontent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: web
          image: ghcr.io/100razpo30-afk/kontent-web:c21e61b4e8ef4654d76fee881cf6e34738431319
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kontent
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80

