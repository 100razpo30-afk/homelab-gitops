apiVersion: v1
kind: PersistentVolume
metadata:
  name: kontent-postgres-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  iscsi:
    targetPortal: "192.168.1.131:3260"
    iqn: "iqn.2026-10.com.terramaster:postgres"
    lun: 0
    fsType: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: kontent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  volumeName: kontent-postgres-pv
---
